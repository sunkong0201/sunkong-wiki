                    </div>
                </div>
            );
        }

        function CategoryView({ categoryName, db, navigateTo }) {
            const docs = Object.values(db).filter(d => !d.isSystem && d.categories && d.categories.split(',').map(s=>s.trim()).includes(categoryName));
            
            const groups = {};
            docs.sort((a,b) => (a.title||"").localeCompare(b.title||"")).forEach(d => {
                const g = getGroup(d.title);
                if(!groups[g]) groups[g] = [];
                groups[g].push(d);
            });

            const groupOrder = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','A-Z','0-9','기타'];
            const sortedKeys = Object.keys(groups).sort((a,b) => {
                let ia = groupOrder.indexOf(a);
                let ib = groupOrder.indexOf(b);
                if(ia === -1) ia = 99;
                if(ib === -1) ib = 99;
                return ia - ib;
            });

            return (
                <div className="p-4 sm:p-6 bg-white border border-gray-200 shadow-sm min-h-[50vh] rounded">
                    <h1 className="text-2xl sm:text-3xl font-bold mb-6 border-b-2 border-teal-600 pb-2 text-teal-800">분류: {categoryName}</h1>
                    {sortedKeys.length === 0 ? <p className="text-gray-500">이 분류에 해당하는 문서가 없습니다.</p> : null}
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {sortedKeys.map(k => (
                            <div key={k} className="mb-4">
                                <h2 className="text-xl font-bold border-b border-gray-300 mb-2 text-gray-700 pb-1">{k}</h2>
                                <ul className="list-none space-y-2">
                                    {groups[k].map(d => (
                                        <li key={d.id} className="flex items-center gap-2">
                                            <span className="w-1.5 h-1.5 rounded-full bg-teal-500 shrink-0"></span>
                                            <a href={`#${d.id}`} onClick={(e)=>{e.preventDefault(); navigateTo(d.id);}} className="text-blue-600 hover:underline font-medium">
                                                {d.title} {d.subtitle && <span className="text-gray-400 text-xs font-normal">({d.subtitle})</span>}
                                            </a>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function GalleryModal({ db, handleSaveData, context, onClose }) {
            const [isUploading, setIsUploading] = useState(false);

            const handleUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsUploading(true);
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let { width, height } = img;
                        const MAX_SIZE = 1200;
                        if (width > MAX_SIZE || height > MAX_SIZE) {
                            if (width > height) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                            else { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
                        
                        const newId = `img_${Date.now()}`;
                        const newDb = { ...db, _gallery: { ...(db._gallery || {}), [newId]: compressedBase64 } };
                        handleSaveData(newDb);
                        setIsUploading(false);

                        if (context && context.action) {
                            context.action(newId);
                            onClose();
                        }
                    };
                };
                reader.readAsDataURL(file);
            };

            const handleDelete = (id) => {
                if(!confirm("이 사진을 삭제하면 사용 중인 문서에서 사진이 보이지 않게 됩니다. 영구 삭제하시겠습니까?")) return;
                const newDb = { ...db };
                newDb._gallery = { ...newDb._gallery };
                delete newDb._gallery[id];
                handleSaveData(newDb);
            };

            const gallery = db._gallery || {};
            const entries = Object.entries(gallery).sort((a,b) => b[0].localeCompare(a[0])); 

            return (
                <div className="fixed inset-0 bg-black/70 z-[200] flex items-center justify-center p-2 sm:p-4">
                    <div className="bg-white rounded-lg w-full max-w-4xl h-[85vh] flex flex-col shadow-2xl">
                        <div className="flex justify-between items-center p-4 border-b">
                            <h2 className="text-xl font-bold flex items-center gap-2"><IconImage size={24} className="text-teal-600"/> 사진 보관함</h2>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800 bg-gray-100 rounded-full p-1"><IconX size={20}/></button>
                        </div>
                        <div className="p-4 border-b bg-teal-50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div className="text-sm text-teal-800">
                                <p className="font-bold mb-1">용량 절약 및 일괄 관리 공간입니다.</p>
                                <p className="text-xs opacity-90">새 사진을 업로드하면 서버 용량에 맞게 자동으로 최적화되어 평생 저장됩니다.</p>
                            </div>
                            <label className="btn-primary cursor-pointer text-sm shrink-0 shadow flex items-center gap-1">
                                <IconPlus size={16} /> 새 사진 업로드
                                <input type="file" accept="image/*" className="hidden" onChange={handleUpload} disabled={isUploading} />
                            </label>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 bg-gray-100 content-start">
                            {isUploading && <div className="col-span-full text-center py-8 text-teal-600 font-bold animate-pulse">사진을 최적화하여 업로드 중입니다...</div>}
                            {entries.length === 0 && !isUploading && <div className="col-span-full text-center py-12 text-gray-400 font-medium">보관함이 비어있습니다. 새 사진을 올려보세요!</div>}
                            
                            {entries.map(([id, src]) => (
                                <div key={id} className="bg-white border border-gray-200 rounded shadow-sm flex flex-col overflow-hidden">
                                    <div className="h-32 bg-gray-50 flex items-center justify-center border-b p-1 relative group">
                                        <img src={src} className="max-w-full max-h-full object-contain" />
                                    </div>
                                    <div className="p-2 flex flex-col gap-1">
                                        <div className="flex gap-1 justify-center mt-1">
                                            {context && context.action ? (
                                                <button onClick={() => { context.action(id); onClose(); }} className="flex-1 bg-teal-100 hover:bg-teal-200 text-teal-800 text-xs py-1.5 rounded font-bold shadow-sm">이 사진 선택</button>
                                            ) : (
                                                <button onClick={() => { navigator.clipboard.writeText(`[사진:${id}]`); alert('태그가 복사되었습니다! 본문 원하는 곳에 붙여넣기 하세요.'); }} className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-[10px] sm:text-xs py-1.5 rounded font-bold border border-gray-300">태그 복사</button>
                                            )}
                                            <button onClick={() => handleDelete(id)} className="bg-red-50 hover:bg-red-100 text-red-500 px-2 py-1.5 rounded border border-red-100"><IconTrash size={14}/></button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const resolveImg = (url, gallery) => {
            if (url && url.startsWith('img_') && gallery && gallery[url]) return gallery[url];
            return url;
        };

        function WikiTable({ rows, navigateTo, footnotes, contentImages, docColors, gallery }) {
            return (
                <div className="overflow-x-auto my-4 w-full">
                    <table className="border-collapse border border-gray-300 w-full text-sm">
                        <tbody>
                            {rows.map((row, rIdx) => {
                                let cells = row;
                                if (typeof row === 'string') {
                                    cells = row.slice(2, -2).split('||').map(c => c.trim());
                                }
                                const isHeader = rIdx === 0;
                                return (
                                    <tr key={rIdx}>
                                        {cells.map((cell, cIdx) => (
                                            <td key={cIdx} 
                                                className={`border border-gray-300 p-2 break-keep align-middle ${isHeader ? 'text-white font-bold text-center' : 'bg-white'}`}
                                                style={isHeader ? { backgroundColor: docColors.profileColor } : {}}
                                            >
                                                <InlineParser text={cell} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} />
                                            </td>
                                        ))}
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        }

        function DocumentView({ doc, navigateTo, gallery }) {
            const docColors = {
                profileColor: doc.profileColor || '#475569',
                spoilerColor: doc.spoilerColor || '#0f766e',
                quoteColor: doc.quoteColor || '#374151'
            };

            const globalFootnotes = [];
            const extractFn = (text) => {
                if (!text) return "";
                return text.replace(/\[\*\s*([\s\S]*?)\]/g, (match, fnContent) => {
                    globalFootnotes.push(fnContent.replace(/\n/g, '__BR__'));
                    return `__FOOTNOTE_${globalFootnotes.length - 1}__`;
                });
            };

            const parsedEngName = extractFn(doc.engName);
            const parsedAttributes = (doc.attributes || []).map(attr => ({
                label: extractFn(attr.label),
                value: extractFn(attr.value)
            }));
            
            let parsedContent = extractFn(doc.content);
            parsedContent = parsedContent.replace(/\{\{([\s\S]*?)\}\}/g, (match, inner) => {
                if (inner.startsWith('스포일러:') || inner.startsWith('숨김:')) {
                    return `{{${inner.replace(/\n/g, '__BR__')}}}`;
                }
                return match;
            });

            const headings = [];
            let isFolding = false;
            let mainCount = 0;
            let subCount = 0;
            let globalIndex = 0;
            
            parsedContent.split('\n').forEach((line) => {
                const rawLine = line.trim();
                if (rawLine.match(/^\[접기:(.+?)\]$/)) isFolding = true;
                if (rawLine === '[\/접기]') isFolding = false;
                
                if (!isFolding) {
                    const match = rawLine.match(/^(==+)\s+(.+?)\s+\1$/);
                    if (match && match[1].length <= 3) {
                        const level = match[1].length;
                        let numStr = "";
                        if (level === 2) { mainCount++; subCount = 0; numStr = `${mainCount}.`; }
                        else if (level === 3) { subCount++; numStr = `${mainCount}.${subCount}.`; }
                        
                        headings.push({ level, title: match[2], numStr, id: `heading-${globalIndex}` });
                        globalIndex++;
                    }
                }
            });

            const profileImages = (doc.profileImages && doc.profileImages.length > 0) ? doc.profileImages : (doc.image ? [{ url: doc.image, caption: "" }] : []);
            const showProfile = !doc.hideProfile;

            return (
                <div className="relative">
                    <div className="mb-6">
                        <div className="flex justify-between items-end border-b-2 border-gray-300 pb-2 mb-2">
                            <h1 className="text-3xl sm:text-4xl font-bold text-gray-900">{doc.title}</h1>
                        </div>
                        
                        <div className="text-left text-xs text-gray-500 mb-3 font-medium">
                            최근 수정 시각: {doc.lastModified ? (() => {
                                const d = new Date(doc.lastModified);
                                const pad = n => n.toString().padStart(2, '0');
                                return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
                            })() : '기록 없음'}
                        </div>

                        {doc.categories && (
                            <div className="border border-gray-300 p-2 mb-4 bg-white flex flex-wrap items-center gap-1 text-sm rounded-sm">
                                <strong className="text-gray-700 mr-1">분류:</strong>
                                <ul className="flex flex-wrap m-0 p-0 list-none items-center">
                                    {doc.categories.split(',').filter(c => c.trim()).map((c, i, arr) => (
                                        <li key={i} className="flex items-center">
                                            <a href={`#category:${c.trim()}`} onClick={(e) => { e.preventDefault(); navigateTo(`category:${c.trim()}`); }} className="text-teal-700 font-medium hover:underline cursor-pointer">
                                                {c.trim()}
                                            </a>
                                            {i < arr.length - 1 && <span className="mx-2 text-gray-300">|</span>}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        )}
                    </div>

                    <div className="flex flex-col gap-6 relative">
                        {showProfile && !doc.isSystem && (
                            <div className="mx-auto w-full max-w-[700px] border border-gray-300 bg-white shadow-sm overflow-hidden z-10 relative">
                                <div className="text-center p-3 text-white border-b border-gray-300" style={{ backgroundColor: docColors.profileColor }}>
                                    <div className="font-bold text-xl">{doc.title}</div>
                                    {doc.engName && (
                                        <div className="text-xs opacity-90 mt-0.5">
                                            <InlineParser text={parsedEngName} navigateTo={navigateTo} footnotes={globalFootnotes} contentImages={doc.contentImages || []} docColors={docColors} gallery={gallery} />
                                        </div>
                                    )}
                                </div>
                                
                                {profileImages.length > 0 ? (
                                    <div className={`grid ${profileImages.length === 1 ? 'grid-cols-1' : 'grid-cols-2'} gap-[1px] bg-gray-300 border-b border-gray-300 w-full`}>
                                        {profileImages.map((imgObj, idx) => (
                                            <div key={idx} className="flex flex-col bg-white">
                                                <div className="w-full bg-gray-100 flex items-center justify-center">
                                                    <img 
                                                        src={resolveImg(imgObj.url, gallery)} 
                                                        alt={`${doc.title} ${idx}`} 
                                                        className={`w-full object-contain drop-shadow-sm ${profileImages.length === 1 ? 'max-h-[600px]' : 'max-h-[400px]'}`} 
                                                    />
                                                </div>
                                                {imgObj.caption && (
                                                    <div className="text-center text-xs p-1.5 text-white border-t border-gray-300 break-keep" style={{ backgroundColor: docColors.profileColor }}>
                                                        ▲ <InlineParser text={imgObj.caption} navigateTo={navigateTo} footnotes={globalFootnotes} contentImages={doc.contentImages || []} docColors={docColors} gallery={gallery} />
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="w-full bg-gray-100 flex items-center justify-center border-b border-gray-300 py-12">
                                        <div className="text-gray-400 flex flex-col items-center">
                                            <IconImage size={32} className="mb-2" />
                                            <span className="text-sm font-medium">추가예정</span>
                                        </div>
                                    </div>
                                )}

                                {parsedAttributes.length > 0 && (
                                    <table className="w-full text-sm">
                                        <tbody>
                                            {parsedAttributes.map((attr, idx) => (
                                                <tr key={idx} className="border-b border-gray-200 last:border-0">
                                                    <th className="w-1/3 p-2 border-r border-gray-200 text-white font-medium text-center align-middle" style={{ backgroundColor: docColors.profileColor }}>
                                                        <InlineParser text={attr.label} navigateTo={navigateTo} footnotes={globalFootnotes} contentImages={doc.contentImages || []} docColors={docColors} gallery={gallery} />
                                                    </th>
                                                    <td className="p-2 text-center align-middle bg-white break-keep">
                                                        <InlineParser text={attr.value} navigateTo={navigateTo} footnotes={globalFootnotes} contentImages={doc.contentImages || []} docColors={docColors} gallery={gallery} />
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        )}

                        <div className="content-wrapper w-full">
                            {headings.length > 0 ? (
                                <div className="border border-gray-300 p-4 mb-6 inline-block min-w-[200px] bg-gray-50 w-full sm:w-auto">
                                    <div className="font-bold mb-2 text-lg">목차</div>
                                    <ul className="list-none pl-1 space-y-1 text-sm text-blue-700">
                                        {headings.map((h, i) => (
                                            <li key={i} className={h.level === 3 ? "ml-4" : ""}>
                                                <a 
                                                    href={`#${h.id}`} 
                                                    onClick={(e) => {
                                                        e.preventDefault();
                                                        document.getElementById(h.id)?.scrollIntoView({ behavior: 'smooth' });
                                                    }}
                                                    className="hover:underline flex gap-2"
                                                >
                                                    <span className="font-bold shrink-0">{h.numStr}</span>
                                                    <span>{h.title}</span>
                                                </a>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ) : null}
                            
                            <div className="wiki-content">
                                <WikiRenderer content={parsedContent} navigateTo={navigateTo} globalFootnotes={globalFootnotes} contentImages={doc.contentImages || []} docColors={docColors} gallery={gallery} tables={doc.tables || []} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function SectionBlock({ section, navigateTo, footnotes, contentImages, docColors, gallery, tables }) {
            const [isOpen, setIsOpen] = useState(true);
            if (!section.heading) {
                return (
                    <div>
                        {renderLines(section.lines, navigateTo, footnotes, contentImages, docColors, gallery, tables)}
                        {section.subSections.map((sub, idx) => (
                            <SubSectionBlock key={idx} subSection={sub} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} tables={tables} />
                        ))}
                    </div>
                );
            }
            return (
                <div className="mb-8">
                    <div 
                        className="flex items-center border-b-2 border-gray-300 pb-1 mt-8 mb-4 cursor-pointer hover:bg-gray-50 transition-colors select-none group scroll-mt-20"
                        onClick={() => setIsOpen(!isOpen)}
                        title={isOpen ? "클릭하여 단락 접기" : "클릭하여 단락 펼치기"}
                        id={section.id}
                    >
                        <span className="text-teal-800 mr-2 text-lg transition-transform duration-200 inline-block" style={{ transform: isOpen ? 'rotate(0deg)' : 'rotate(-90deg)' }}>▼</span>
                        <h2 className="text-xl sm:text-2xl font-bold text-teal-800">{section.numStr} {section.heading}</h2>
                    </div>
                    <div style={{ display: isOpen ? 'block' : 'none' }}>
                        <div className="pl-1 sm:pl-2">
                            {renderLines(section.lines, navigateTo, footnotes, contentImages, docColors, gallery, tables)}
                            {section.subSections.map((sub, idx) => (
                                <SubSectionBlock key={idx} subSection={sub} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} tables={tables} />
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function SubSectionBlock({ subSection, navigateTo, footnotes, contentImages, docColors, gallery, tables }) {
            const [isOpen, setIsOpen] = useState(true);
            return (
                <div className="mb-4 mt-6">
                    <div 
                        className="flex items-center border-b border-gray-200 pb-1 mb-3 cursor-pointer hover:bg-gray-50 transition-colors select-none group scroll-mt-20"
                        onClick={() => setIsOpen(!isOpen)}
                        title={isOpen ? "클릭하여 단락 접기" : "클릭하여 단락 펼치기"}
                        id={subSection.id}
                    >
                        <span className="text-teal-700 mr-2 text-base transition-transform duration-200 inline-block" style={{ transform: isOpen ? 'rotate(0deg)' : 'rotate(-90deg)' }}>▼</span>
                        <h3 className="text-lg sm:text-xl font-bold text-teal-700">{subSection.numStr} {subSection.heading}</h3>
                    </div>
                    <div style={{ display: isOpen ? 'block' : 'none' }}>
                        <div className="pl-1 sm:pl-2">
                            {renderLines(subSection.lines, navigateTo, footnotes, contentImages, docColors, gallery, tables)}
                        </div>
                    </div>
                </div>
            );
        }

        function CollapsibleBlock({ title, content, navigateTo, contentImages, docColors, gallery, tables }) {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="border border-gray-300 rounded my-3 overflow-hidden">
                    <button 
                        onClick={() => setIsOpen(!isOpen)} 
                        className="w-full text-left bg-gray-100 hover:bg-gray-200 px-3 py-2 font-bold text-sm flex justify-between items-center outline-none"
                    >
                        <span>{isOpen ? '▼' : '▶'} {title}</span>
                        <span className="text-xs text-gray-500">{isOpen ? "[접기]" : "[펼치기]"}</span>
                    </button>
                    {isOpen && (
                        <div className="p-3 bg-white border-t border-gray-200">
                            {renderLines(content.split('\n'), navigateTo, [], contentImages, docColors, gallery, tables)}
                        </div>
                    )}
                </div>
            );
        }

        function renderLines(lines, navigateTo, footnotes, contentImages, docColors, gallery, tables) {
            const elements = [];
            let isFolding = false;
            let foldTitle = "";
            let foldLines = [];
            
            let isQuote = false;
            let quoteLines = [];

            let inTable = false;
            let tableRows = [];

            for (let i = 0; i < lines.length; i++) {
                const rawLine = lines[i];
                const line = rawLine.trim();

                const foldStartMatch = line.match(/^\[접기:(.+?)\]$/);
                if (foldStartMatch) {
                    isFolding = true;
                    foldTitle = foldStartMatch[1];
                    foldLines = [];
                    continue;
                }

                if (line === '[\/접기]') {
                    isFolding = false;
                    elements.push(
                        <CollapsibleBlock key={`fold-${i}`} title={foldTitle} content={foldLines.join('\n')} navigateTo={navigateTo} contentImages={contentImages} docColors={docColors} gallery={gallery} tables={tables} />
                    );
                    continue;
                }

                if (isFolding) {
                    foldLines.push(rawLine);
                    continue;
                }
                
                if (line.startsWith('||') && line.endsWith('||')) {
                    inTable = true;
                    tableRows.push(line);
                    continue;
                } else if (inTable) {
                    elements.push(<WikiTable key={`table-${i}`} rows={tableRows} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} />);
                    inTable = false;
                    tableRows = [];
                }

                const guiTableMatch = line.match(/^\[표:(\d+)\]$/);
                if (guiTableMatch) {
                    const tIdx = parseInt(guiTableMatch[1], 10);
                    if (tables && tables[tIdx]) {
                        elements.push(<WikiTable key={`guitable-${i}`} rows={tables[tIdx].rows} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} />);
                    }
                    continue;
                }
                
                if (!isQuote && line.startsWith('>')) {
                    let text = line.slice(1).trim(); 
                    if (text.endsWith('<')) {
                        text = text.slice(0, -1).trim(); 
                        elements.push(
                            <blockquote key={`quote-${i}`} className="border-l-4 pl-4 py-2 my-2 bg-gray-50 italic rounded-r break-words" style={{ borderLeftColor: docColors.quoteColor, color: docColors.quoteColor }}>
                                <InlineParser text={text} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} />
                            </blockquote>
                        );
                    } else {
                        isQuote = true;
                        quoteLines = [text];
                    }
                    continue;
                }

                if (isQuote) {
                    if (line.endsWith('<')) {
                        isQuote = false;
                        let text = line.slice(0, -1).trim(); 
                        quoteLines.push(text);
                        
                        const combinedQuote = quoteLines.join('__BR__');
                        elements.push(
                            <blockquote key={`quote-${i}`} className="border-l-4 pl-4 py-2 my-2 bg-gray-50 italic rounded-r break-words" style={{ borderLeftColor: docColors.quoteColor, color: docColors.quoteColor }}>
                                <InlineParser text={combinedQuote} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} />
                            </blockquote>
                        );
                    } else {
                        quoteLines.push(line);
                    }
                    continue;
                }

                if (line === '') { elements.push(<br key={`br-${i}`} />); continue; }

                if (line === '[스포일러경고]') {
                    elements.push(
                        <div key={`warn-${i}`} className="bg-red-50 border-l-4 border-red-500 p-3 sm:p-4 my-4 rounded-r">
                            <p className="text-red-700 font-bold flex items-center gap-2"><span className="text-lg sm:text-xl">⚠️</span> 주의사항</p>
                            <p className="text-red-600 text-xs sm:text-sm mt-1">이 문서 하단에는 치명적인 스포일러가 포함되어 있습니다.</p>
                        </div>
                    );
                    continue;
                }

                const ytMatch = line.match(/^\[유튜브:([a-zA-Z0-9_-]+)\]$/);
                if (ytMatch) {
                    elements.push(
                        <div key={`yt-${i}`} className="my-4 aspect-video max-w-2xl w-full">
                            <iframe width="100%" height="100%" src={`https://www.youtube.com/embed/${ytMatch[1]}`} frameBorder="0" allowFullScreen></iframe>
                        </div>
                    );
                    continue;
                }

                elements.push(
                    <p key={`p-${i}`} className="mb-2 relative break-words">
                        <InlineParser text={line} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} />
                    </p>
                );
            }

            if (isFolding) elements.push(<CollapsibleBlock key={`fold-end`} title={foldTitle} content={foldLines.join('\n')} navigateTo={navigateTo} contentImages={contentImages} docColors={docColors} gallery={gallery} tables={tables} />);
            if (inTable) elements.push(<WikiTable key={`table-end`} rows={tableRows} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} />);
            if (isQuote) {
                const combinedQuote = quoteLines.join('__BR__');
                elements.push(
                    <blockquote key={`quote-end`} className="border-l-4 pl-4 py-2 my-2 bg-gray-50 italic rounded-r break-words" style={{ borderLeftColor: docColors.quoteColor, color: docColors.quoteColor }}>
                        <InlineParser text={combinedQuote} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} />
                    </blockquote>
                );
            }
            
            return elements;
        }

        function WikiRenderer({ content, navigateTo, globalFootnotes = [], contentImages = [], docColors, gallery, tables }) {
            const sections = [];
            let currentH2 = { heading: null, numStr: "", id: "", lines: [], subSections: [] };
            let currentH3 = null;
            
            const rawLines = (content || "").split('\n');
            let isFolding = false;
            let mainCount = 0;
            let subCount = 0;
            let globalIndex = 0;
            
            for (let i = 0; i < rawLines.length; i++) {
                const line = rawLines[i].trim();
                const foldStartMatch = line.match(/^\[접기:(.+?)\]$/);
                
                if (foldStartMatch) isFolding = true;
                if (line === '[\/접기]') isFolding = false;
                
                const headingMatch = !isFolding ? line.match(/^(==+)\s+(.+?)\s+\1$/) : null;
                
                if (headingMatch && headingMatch[1].length === 2) {
                    if (currentH2.heading || currentH2.lines.length > 0 || currentH2.subSections.length > 0) {
                        sections.push(currentH2);
                    }
                    mainCount++;
                    subCount = 0;
                    currentH2 = { 
                        heading: headingMatch[2], 
                        numStr: `${mainCount}.`, 
                        id: `heading-${globalIndex++}`, 
                        lines: [], 
                        subSections: [] 
                    };
                    currentH3 = null;
                } else if (headingMatch && headingMatch[1].length === 3) {
                    subCount++;
                    currentH3 = {
                        heading: headingMatch[2],
                        numStr: `${mainCount}.${subCount}.`,
                        id: `heading-${globalIndex++}`,
                        lines: []
                    };
                    currentH2.subSections.push(currentH3);
                } else {
                    if (currentH3) currentH3.lines.push(rawLines[i]);
                    else currentH2.lines.push(rawLines[i]);
                }
            }
            sections.push(currentH2);

            return (
                <div>
                    {sections.map((sec, idx) => (
                        <SectionBlock key={idx} section={sec} navigateTo={navigateTo} footnotes={globalFootnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} tables={tables} />
                    ))}
                    
                    {globalFootnotes.length > 0 ? (
                        <div className="mt-12 pt-4 border-t-2 border-gray-200">
                            <h3 className="font-bold text-lg mb-2">주석</h3>
                            <ul className="text-sm space-y-2">
                                {globalFootnotes.map((fn, idx) => (
                                    <li key={idx} id={`fn-bottom-${idx}`} className="flex gap-2 items-start mt-1">
                                        <a href={`#fn-text-${idx}`} className="text-blue-600 font-bold hover:underline shrink-0" onClick={(e) => {
                                            e.preventDefault();
                                            document.getElementById(`fn-text-${idx}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                        }}>
                                            [{idx + 1}]
                                        </a>
                                        <span><InlineParser text={fn} navigateTo={navigateTo} footnotes={globalFootnotes} isInsideFootnote={true} contentImages={contentImages} docColors={docColors} gallery={gallery} /></span>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    ) : null}
                </div>
            );
        }

        function InlineParser({ text, navigateTo, footnotes, isInsideFootnote = false, contentImages = [], docColors, gallery = {} }) {
            if (!text) return null;
            const regex = /(\[\[.*?\]\]|\{\{숨김:.*?\|.*?\}\}|\{\{스포일러:.*?\}\}|__FOOTNOTE_\d+__|\[본문사진:\d+\]|\[사진:img_[^\]]+\]|'''.*?'''|\*\*.*?\*\*|~~.*?~~|''.*?''|__BR__)/g;
            const parts = text.split(regex);

            return (
                <>
                    {parts.map((part, i) => {
                        if (!part) return null;
                        
                        if (part === '__BR__') return <br key={i} />;
                        
                        if (part.startsWith('[[') && part.endsWith(']]')) {
                            const inner = part.slice(2, -2);
                            const [target, display] = inner.split('|');
                            return (
                                <a key={i} href={`#${target}`} onClick={(e) => { e.preventDefault(); navigateTo(target); }} className="text-blue-600 hover:underline font-medium">
                                    <InlineParser text={display || target} navigateTo={navigateTo} footnotes={footnotes} isInsideFootnote={isInsideFootnote} contentImages={contentImages} docColors={docColors} gallery={gallery} />
                                </a>
                            );
                        }
                        
                        if (part.startsWith('{{숨김:') && part.endsWith('}}')) {
                            const inner = part.slice(5, -2);
                            const splitIndex = inner.indexOf('|');
                            if (splitIndex !== -1) {
                                const placeholder = inner.slice(0, splitIndex);
                                const content = inner.slice(splitIndex + 1);
                                return <SpoilerToggle key={i} placeholder={placeholder} content={content} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} />;
                            }
                        }

                        if (part.startsWith('{{스포일러:') && part.endsWith('}}')) {
                            const content = part.slice(7, -2);
                            return <SpoilerToggle key={i} placeholder="스포일러 주의" content={content} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} />;
                        }
                        
                        if (part.startsWith('[본문사진:') && part.endsWith(']')) {
                            const imgIdx = parseInt(part.slice(6, -1), 10);
                            if (contentImages[imgIdx]) {
                                return <img key={i} src={contentImages[imgIdx]} alt={`본문 첨부 이미지 ${imgIdx}`} className="max-w-full h-auto rounded my-2 border border-gray-200 block" />;
                            }
                            return null;
                        }

                        if (part.startsWith('[사진:img_') && part.endsWith(']')) {
                            const imgId = part.slice(4, -1);
                            if (gallery[imgId]) {
                                return <img key={i} src={gallery[imgId]} alt={`보관함 이미지 ${imgId}`} className="max-w-full h-auto rounded my-2 border border-gray-200 block" />;
                            }
                            return <span key={i} className="text-red-500 border border-red-500 p-1 text-xs rounded">[삭제된 사진]</span>;
                        }

                        const fnMatch = part.match(/__FOOTNOTE_(\d+)__/);
                        if (fnMatch) {
                            const fnIndex = parseInt(fnMatch[1], 10);
                            return <FootnotePopup key={i} index={fnIndex} content={footnotes[fnIndex]} navigateTo={navigateTo} contentImages={contentImages} docColors={docColors} gallery={gallery} />;
                        }
                        
                        if ((part.startsWith("'''") && part.endsWith("'''")) || (part.startsWith("**") && part.endsWith("**"))) {
                            const content = part.startsWith("'''") ? part.slice(3, -3) : part.slice(2, -2);
                            return (
                                <strong key={i} className="font-bold">
                                    <InlineParser text={content} navigateTo={navigateTo} footnotes={footnotes} isInsideFootnote={isInsideFootnote} contentImages={contentImages} docColors={docColors} gallery={gallery} />
                                </strong>
                            );
                        }
                        
                        if (part.startsWith("~~") && part.endsWith("~~")) {
                            const content = part.slice(2, -2);
                            return (
                                <del key={i} className="line-through text-gray-500">
                                    <InlineParser text={content} navigateTo={navigateTo} footnotes={footnotes} isInsideFootnote={isInsideFootnote} contentImages={contentImages} docColors={docColors} gallery={gallery} />
                                </del>
                            );
                        }
                        
                        if (part.startsWith("''") && part.endsWith("''")) {
                            const content = part.slice(2, -2);
                            return (
                                <em key={i} className="italic">
                                    <InlineParser text={content} navigateTo={navigateTo} footnotes={footnotes} isInsideFootnote={isInsideFootnote} contentImages={contentImages} docColors={docColors} gallery={gallery} />
                                </em>
                            );
                        }
                        
                        return <span key={i}>{part}</span>;
                    })}
                </>
            );
        }

        function SpoilerToggle({ placeholder, content, navigateTo, footnotes, contentImages, docColors, gallery }) {
            const [isOpen, setIsOpen] = useState(false);
            
            if (isOpen) {
                return (
                    <span className="mx-1 leading-relaxed">
                        <span 
                            className="cursor-pointer text-xs font-bold text-gray-100 bg-gray-400 hover:bg-gray-500 mr-1 px-1.5 py-0.5 rounded shadow-sm align-middle" 
                            onClick={(e) => { e.stopPropagation(); setIsOpen(false); }}
                            title="클릭하여 다시 숨기기"
                        >
                            접기
                        </span>
                        <span style={{ color: docColors.spoilerColor }}>
                            <InlineParser text={content} navigateTo={navigateTo} footnotes={footnotes} contentImages={contentImages} docColors={docColors} gallery={gallery} />
                        </span>
                    </span>
                );
            }

            return (
                <span 
                    className="cursor-pointer font-bold select-none border-b border-dashed hover:opacity-70 mx-1 transition-opacity" 
                    style={{ color: docColors.spoilerColor, borderBottomColor: docColors.spoilerColor }}
                    onClick={(e) => { e.stopPropagation(); setIsOpen(true); }}
                    title="클릭하여 보기"
                >
                    {placeholder}
                </span>
            );
        }

        function FootnotePopup({ index, content, navigateTo, contentImages, docColors, gallery }) {
            const [show, setShow] = useState(false);
            const popupRef = useRef(null);

            useEffect(() => {
                const handleClick = (e) => { if (popupRef.current && !popupRef.current.contains(e.target)) setShow(false); };
                if (show) document.addEventListener('mousedown', handleClick);
                return () => document.removeEventListener('mousedown', handleClick);
            }, [show]);

            return (
                <span className="relative inline-block scroll-mt-24" ref={popupRef} id={`fn-text-${index}`}>
                    <a href={`#fn-bottom-${index}`} className="text-blue-600 text-xs align-super cursor-pointer hover:underline mx-0.5" onClick={(e) => { e.preventDefault(); setShow(!show); }}>
                        [{index + 1}]
                    </a>
                    
                    {show && <div className="fixed inset-0 bg-black/20 z-[90] sm:hidden" onClick={() => setShow(false)}></div>}
                    
                    {show && (
                        <div className="fixed sm:absolute z-[100] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 sm:top-auto sm:translate-y-0 sm:bottom-full sm:left-1/2 sm:-translate-x-1/2 sm:mb-2 w-[90vw] max-w-sm sm:w-64 p-4 sm:p-3 bg-white border border-gray-300 shadow-2xl rounded-lg sm:rounded text-sm text-gray-800 break-words">
                            <div className="hidden sm:block absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-3 h-3 bg-white border-b border-r border-gray-300 rotate-45"></div>
                            
                            <div className="pr-6 max-h-[60vh] overflow-y-auto">
                                <InlineParser text={content} navigateTo={navigateTo} footnotes={[]} isInsideFootnote={true} contentImages={contentImages} docColors={docColors} gallery={gallery} />
                            </div>
                            
                            <button className="absolute top-2 right-2 sm:top-1.5 sm:right-1.5 text-gray-400 hover:text-gray-600 bg-gray-100 sm:bg-transparent rounded-full p-1" onClick={() => setShow(false)}><IconX size={14} /></button>
                        </div>
                    )}
                </span>
            );
        }

        function EditorView({ editData, setEditData, onSave, onCancel, onDelete, openGallery, gallery }) {
            const [showHelp, setShowHelp] = useState(false);
            const handleChange = (field, value) => setEditData(prev => ({ ...prev, [field]: value }));
            
            const addProfileImage = () => handleChange('profileImages', [...(editData.profileImages || []), { url: "", caption: "" }]);
            const removeProfileImage = (index) => handleChange('profileImages', (editData.profileImages || []).filter((_, i) => i !== index));
            const handleProfileImageChange = (index, field, value) => {
                const newImgs = [...(editData.profileImages || [])];
                newImgs[index][field] = value;
                handleChange('profileImages', newImgs);
            };
            const moveProfileImageUp = (index) => {
                if (index === 0) return;
                const newImgs = [...(editData.profileImages || [])];
                const temp = newImgs[index - 1];
                newImgs[index - 1] = newImgs[index];
                newImgs[index] = temp;
                handleChange('profileImages', newImgs);
            };
            const moveProfileImageDown = (index) => {
                const newImgs = [...(editData.profileImages || [])];
                if (index === newImgs.length - 1) return;
                const temp = newImgs[index + 1];
                newImgs[index + 1] = newImgs[index];
                newImgs[index] = temp;
                handleChange('profileImages', newImgs);
            };

            const handleAttributeChange = (index, field, value) => {
                const newAttrs = [...(editData.attributes || [])];
                newAttrs[index][field] = value;
                handleChange('attributes', newAttrs);
            };
            const addAttribute = () => handleChange('attributes', [...(editData.attributes || []), { label: "", value: "" }]);
            const removeAttribute = (index) => handleChange('attributes', (editData.attributes || []).filter((_, i) => i !== index));
            const moveAttributeUp = (index) => {
                if (index === 0) return;
                const newAttrs = [...(editData.attributes || [])];
                const temp = newAttrs[index - 1];
                newAttrs[index - 1] = newAttrs[index];
                newAttrs[index] = temp;
                handleChange('attributes', newAttrs);
            };
            const moveAttributeDown = (index) => {
                const newAttrs = [...(editData.attributes || [])];
                if (index === newAttrs.length - 1) return;
                const temp = newAttrs[index + 1];
                newAttrs[index + 1] = newAttrs[index];
                newAttrs[index] = temp;
                handleChange('attributes', newAttrs);
            };

            const addTable = () => handleChange('tables', [...(editData.tables || []), { rows: [['항목1', '항목2'], ['내용1', '내용2']] }]);
            const removeTable = (tIdx) => handleChange('tables', (editData.tables || []).filter((_, i) => i !== tIdx));
            const addRow = (tIdx) => {
                const newTables = [...(editData.tables || [])];
                const colCount = newTables[tIdx].rows[0].length;
                newTables[tIdx].rows.push(new Array(colCount).fill(''));
                handleChange('tables', newTables);
            };
            const removeRow = (tIdx) => {
                const newTables = [...(editData.tables || [])];
                if(newTables[tIdx].rows.length > 1) {
                    newTables[tIdx].rows.pop();
                    handleChange('tables', newTables);
                }
            };
            const addCol = (tIdx) => {
                const newTables = [...(editData.tables || [])];
                newTables[tIdx].rows = newTables[tIdx].rows.map(row => [...row, '']);
                handleChange('tables', newTables);
            };
            const removeCol = (tIdx) => {
                const newTables = [...(editData.tables || [])];
                if(newTables[tIdx].rows[0].length > 1) {
                    newTables[tIdx].rows = newTables[tIdx].rows.map(row => row.slice(0, -1));
                    handleChange('tables', newTables);
                }
            };
            const handleTableCell = (tIdx, rIdx, cIdx, val) => {
                const newTables = [...(editData.tables || [])];
                newTables[tIdx].rows[rIdx][cIdx] = val;
                handleChange('tables', newTables);
            };

            const handleContentImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const currentImages = editData.contentImages || [];
                        const newImages = [...currentImages, reader.result];
                        handleChange('contentImages', newImages);
                        handleChange('content', (editData.content || "") + `\n[본문사진:${newImages.length - 1}]\n`);
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className="flex flex-col gap-4 relative">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-2 gap-2">
                        <h2 className="text-xl sm:text-2xl font-bold flex items-center gap-2"><IconEdit className="text-teal-600" /> 문서 편집</h2>
                        <div className="flex gap-2 w-full sm:w-auto justify-end items-center flex-wrap">
                            {!editData.isSystem && (
                                <button onClick={onDelete} className="text-red-500 hover:text-red-700 text-sm flex items-center gap-1 mr-auto sm:mr-4 border border-red-200 px-2 py-1 rounded bg-red-50">
                                    <IconTrash size={16} /> 문서 삭제
                                </button>
                            )}
                            <button onClick={() => setShowHelp(!showHelp)} className="btn-secondary flex items-center gap-1 text-sm"><IconHelp size={16} /> 도움말</button>
                            <button onClick={onCancel} className="btn-secondary text-sm">취소</button>
                            <button onClick={() => onSave(editData)} className="btn-primary flex items-center gap-1 text-sm"><IconSave size={16} /> 저장</button>
                        </div>
                    </div>

                    {showHelp && (
                        <div className="bg-teal-50 border border-teal-200 p-4 rounded text-xs sm:text-sm text-teal-900 mb-2 overflow-x-auto">
                            <h4 className="font-bold mb-2">문법 도움말</h4>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <ul className="list-disc pl-5 space-y-1">
                                    <li><strong>상위 단락:</strong> <code>== 이름 ==</code> (1., 2. 자동부여)</li>
                                    <li><strong>하위 단락:</strong> <code>=== 이름 ===</code> (1.1, 1.2 자동부여)</li>
                                    <li><strong>문서 링크:</strong> <code>[[문서ID|이름]]</code></li>
                                    <li><strong>주석 (플로팅):</strong> <code>[* 주석내용]</code></li>
                                </ul>
                                <ul className="list-disc pl-5 space-y-1">
                                    <li><strong>맞춤 숨김:</strong> <code>{"{{숨김:보여줄글씨|진짜내용}}"}</code></li>
                                    <li><strong>기본 스포일러:</strong> <code>{"{{스포일러:진짜내용}}"}</code></li>
                                    <li><strong>서식:</strong> <code>'''굵게'''</code> / <code>''기울임''</code> / <code>~~취소~~</code></li>
                                    <li><strong>여러줄 인용구:</strong> <code>&gt; 내용 적고 엔터 치다가 끝낼 때 &lt;</code></li>
                                </ul>
                            </div>
                        </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 flex flex-col gap-4">
                            <div>
                                <label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">문서 ID (영문/숫자 권장, 링크용)</label>
                                <input type="text" value={editData.id || ""} disabled={(editData.id === 'home' || (editData.id || "").startsWith('char'))} onChange={(e) => handleChange('id', e.target.value)} className="w-full p-2 border rounded bg-gray-100 text-gray-600 text-sm" />
                            </div>
                            
                            <div className="flex gap-2">
                                <div className="flex-1">
                                    <label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">문서 제목 (이름)</label>
                                    <input type="text" value={editData.title || ""} onChange={(e) => handleChange('title', e.target.value)} className="w-full p-2 border rounded focus:ring-2 ring-teal-400 outline-none text-sm" />
                                </div>
                                <div className="flex-1">
                                    <label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">검색 구분 태그 (AU 등)</label>
                                    <input type="text" placeholder="예: 뱀파이어 AU" value={editData.subtitle || ""} onChange={(e) => handleChange('subtitle', e.target.value)} className="w-full p-2 border rounded focus:ring-2 ring-teal-400 outline-none text-sm" />
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs sm:text-sm font-bold text-gray-700 mb-1">분류 (쉼표로 구분하여 여러 개 입력)</label>
                                <input type="text" placeholder="예: 자캐, 평행우주, 뱀파이어" value={editData.categories || ""} onChange={(e) => handleChange('categories', e.target.value)} className="w-full p-2 border rounded focus:ring-2 ring-teal-400 outline-none text-sm" />
                            </div>

                            <div className="border border-gray-200 p-4 rounded bg-gray-50 mb-2">
                                <div className="flex justify-between items-center mb-2">
                                    <h3 className="font-bold text-gray-800 text-sm sm:text-base">표(Table) 에디터</h3>
                                    <button onClick={addTable} className="text-teal-600 flex items-center hover:bg-teal-100 px-2 py-1 rounded text-xs font-bold bg-white border border-teal-200 shadow-sm"><IconPlus size={14}/> 새 표 만들기</button>
                                </div>
                                
                                {(editData.tables || []).map((table, tIdx) => (
                                    <div key={tIdx} className="mb-4 bg-white p-3 border rounded shadow-sm">
                                        <div className="flex justify-between items-center mb-3 border-b pb-2">
                                            <span className="font-bold text-teal-700 text-sm">표 번호: {tIdx}</span>
                                            <div className="flex gap-2">
                                                <button onClick={() => setEditData(prev => ({...prev, content: (prev.content||"") + `\n[표:${tIdx}]\n`}))} className="bg-teal-100 text-teal-800 text-xs px-2 py-1 rounded hover:bg-teal-200 font-bold shadow-sm">
                                                    본문에 [표:{tIdx}] 넣기
                                                </button>
                                                <button onClick={()=>removeTable(tIdx)} className="text-red-500 hover:bg-red-50 p-1 rounded"><IconTrash size={16}/></button>
                                            </div>
                                        </div>
                                        
                                        <div className="flex flex-wrap gap-2 mb-3 text-xs">
                                            <button onClick={()=>addRow(tIdx)} className="border border-gray-300 bg-gray-50 px-2 py-1.5 rounded hover:bg-gray-100 font-medium">+ 행(가로) 추가</button>
                                            <button onClick={()=>removeRow(tIdx)} className="border border-gray-300 bg-gray-50 px-2 py-1.5 rounded hover:bg-gray-100 font-medium">- 행 삭제</button>
                                            <button onClick={()=>addCol(tIdx)} className="border border-gray-300 bg-gray-50 px-2 py-1.5 rounded hover:bg-gray-100 font-medium">+ 열(세로) 추가</button>
                                            <button onClick={()=>removeCol(tIdx)} className="border border-gray-300 bg-gray-50 px-2 py-1.5 rounded hover:bg-gray-100 font-medium">- 열 삭제</button>
                                        </div>
                                        
                                        <div className="overflow-x-auto pb-2">
                                            <table className="border-collapse border border-gray-300 w-full text-xs min-w-[300px]">
                                                <tbody>
                                                    {table.rows.map((row, rIdx) => (
                                                        <tr key={rIdx}>
                                                            {row.map((cell, cIdx) => (
                                                                <td key={cIdx} className="border border-gray-300 p-1 relative group">
                                                                    <textarea 
                                                                        value={cell} 
                                                                        onChange={(e)=>handleTableCell(tIdx, rIdx, cIdx, e.target.value)} 
                                                                        className="w-full p-1 outline-none resize-y min-h-[40px] focus:ring-1 ring-teal-400" 
                                                                        placeholder={rIdx === 0 ? `제목 항목` : `내용`} 
                                                                    />
                                                                </td>
                                                            ))}
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="flex-1 flex flex-col">
                                <div className="flex justify-between items-center mb-1">
                                    <label className="block text-xs sm:text-sm font-bold text-gray-700">본문 내용</label>
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => openGallery({
                                                action: (imgId) => setEditData(prev => ({ ...prev, content: (prev.content || "") + `\n[사진:${imgId}]\n` }))
                                            })}
                                            className="cursor-pointer text-xs bg-teal-100 hover:bg-teal-200 text-teal-800 px-2 py-1 rounded font-bold flex items-center gap-1 shadow-sm transition-colors"
                                        >
                                            <IconImage size={14} /> 보관함 사진 넣기
                                        </button>
                                    </div>
                                </div>
                                <textarea value={editData.content || ""} onChange={(e) => handleChange('content', e.target.value)} className="w-full h-80 sm:h-96 p-3 border rounded focus:ring-2 ring-teal-400 outline-none font-mono text-xs sm:text-sm leading-relaxed"></textarea>
                            </div>
                        </div>

                        {!editData.isSystem && (
                            <div className="bg-gray-50 border border-gray-200 p-4 rounded h-fit">
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                    <h3 className="font-bold text-base sm:text-lg">프로필 박스 설정</h3>
                                    <label className="flex items-center gap-1 cursor-pointer text-sm font-bold text-gray-700 bg-white px-2 py-1 border border-gray-300 rounded shadow-sm hover:bg-gray-100">
                                        <input type="checkbox" checked={editData.hideProfile || false} onChange={(e) => handleChange('hideProfile', e.target.checked)} className="accent-teal-600 w-4 h-4" />
                                        프로필 숨기기
                                    </label>
                                </div>
                                
                                {!editData.hideProfile && (
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 border border-gray-200 p-2 rounded bg-white">
                                            <div>
                                                <label className="block text-[10px] sm:text-xs font-bold text-gray-700 mb-1">테마 (프로필)</label>
                                                <div className="flex gap-1">
                                                    <input type="color" value={editData.profileColor || "#475569"} onChange={(e) => handleChange('profileColor', e.target.value)} className="h-7 w-8 cursor-pointer p-0 border-0" />
                                                    <input type="text" value={editData.profileColor || "#475569"} onChange={(e) => handleChange('profileColor', e.target.value)} className="flex-1 p-1 border rounded text-xs" />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] sm:text-xs font-bold text-gray-700 mb-1">스포일러 글색</label>
                                                <div className="flex gap-1">
                                                    <input type="color" value={editData.spoilerColor || "#0f766e"} onChange={(e) => handleChange('spoilerColor', e.target.value)} className="h-7 w-8 cursor-pointer p-0 border-0" />
                                                    <input type="text" value={editData.spoilerColor || "#0f766e"} onChange={(e) => handleChange('spoilerColor', e.target.value)} className="flex-1 p-1 border rounded text-xs" />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-[10px] sm:text-xs font-bold text-gray-700 mb-1">인용구 글색</label>
                                                <div className="flex gap-1">
                                                    <input type="color" value={editData.quoteColor || "#374151"} onChange={(e) => handleChange('quoteColor', e.target.value)} className="h-7 w-8 cursor-pointer p-0 border-0" />
                                                    <input type="text" value={editData.quoteColor || "#374151"} onChange={(e) => handleChange('quoteColor', e.target.value)} className="flex-1 p-1 border rounded text-xs" />
                                                </div>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">영문 이름</label>
                                            <input type="text" value={editData.engName || ""} onChange={(e) => handleChange('engName', e.target.value)} className="w-full p-1.5 border rounded text-sm" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1 flex justify-between items-center">
                                                <span>프로필 사진 (보관함 연동)</span>
                                                <button onClick={addProfileImage} className="text-teal-600 flex items-center hover:bg-teal-100 p-1 rounded"><IconPlus size={14} /> 추가</button>
                                            </label>
                                            <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                                                {(editData.profileImages || []).length === 0 && (
                                                    <div className="text-xs text-gray-500 bg-gray-100 p-2 rounded text-center">추가 버튼을 눌러 사진을 등록하세요.</div>
                                                )}
                                                {(editData.profileImages || []).map((imgObj, idx) => (
                                                    <div key={idx} className="border border-gray-200 p-2 rounded bg-gray-50 flex gap-1 sm:gap-2 items-start relative">
                                                        <div className="flex flex-col gap-1 mt-1">
                                                            <button onClick={() => moveProfileImageUp(idx)} disabled={idx === 0} className={`p-1 rounded ${idx === 0 ? 'text-gray-300' : 'text-gray-500 hover:bg-gray-200'}`}><IconArrowUp size={14} /></button>
                                                            <button onClick={() => moveProfileImageDown(idx)} disabled={idx === (editData.profileImages || []).length - 1} className={`p-1 rounded ${idx === (editData.profileImages || []).length - 1 ? 'text-gray-300' : 'text-gray-500 hover:bg-gray-200'}`}><IconArrowDown size={14} /></button>
                                                        </div>
                                                        <div className="flex-1 flex flex-col gap-2">
                                                            <button 
                                                                onClick={() => openGallery({
                                                                    action: (imgId) => {
                                                                        const newImgs = [...(editData.profileImages || [])];
                                                                        newImgs[idx].url = imgId;
                                                                        setEditData(prev => ({ ...prev, profileImages: newImgs }));
                                                                    }
                                                                })}
                                                                className="w-full text-xs bg-teal-100 hover:bg-teal-200 text-teal-800 py-1.5 px-2 rounded font-bold border border-teal-200 flex items-center justify-center gap-1"
                                                            >
                                                                <IconImage size={14}/> {imgObj.url ? '사진 변경' : '보관함 열기 및 선택'}
                                                            </button>
                                                            <input type="text" placeholder="▲ 설명 (예: 1부 기본 복장)" value={imgObj.caption || ""} onChange={(e) => handleProfileImageChange(idx, 'caption', e.target.value)} className="w-full p-1.5 border rounded text-xs" />
                                                        </div>
                                                        {imgObj.url && <img src={resolveImg(imgObj.url, gallery)} alt="preview" className="h-12 w-12 object-contain bg-white border shrink-0" />}
                                                        <button onClick={() => removeProfileImage(idx)} className="text-red-500 hover:bg-red-100 p-1.5 rounded mt-1 shrink-0"><IconTrash size={16} /></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1 flex justify-between items-center">
                                                <span>상세 정보 칸</span>
                                                <button onClick={addAttribute} className="text-teal-600 flex items-center hover:bg-teal-100 p-1 rounded"><IconPlus size={14} /> 추가</button>
                                            </label>
                                            <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                                                {(editData.attributes || []).map((attr, idx) => (
                                                    <div key={idx} className="flex gap-1 items-start">
                                                        <div className="flex flex-col sm:flex-row gap-0 sm:gap-1 mt-0.5">
                                                            <button onClick={() => moveAttributeUp(idx)} disabled={idx === 0} className={`p-1 rounded ${idx === 0 ? 'text-gray-300' : 'text-gray-500 hover:bg-gray-200'}`}><IconArrowUp size={14} /></button>
                                                            <button onClick={() => moveAttributeDown(idx)} disabled={idx === (editData.attributes || []).length - 1} className={`p-1 rounded ${idx === (editData.attributes || []).length - 1 ? 'text-gray-300' : 'text-gray-500 hover:bg-gray-200'}`}><IconArrowDown size={14} /></button>
                                                        </div>
                                                        <input type="text" placeholder="항목" value={attr.label || ""} onChange={(e) => handleAttributeChange(idx, 'label', e.target.value)} className="w-1/3 p-1.5 border rounded text-xs mt-0.5" />
                                                        <input type="text" placeholder="내용" value={attr.value || ""} onChange={(e) => handleAttributeChange(idx, 'value', e.target.value)} className="flex-1 p-1.5 border rounded text-xs mt-0.5" />
                                                        <button onClick={() => removeAttribute(idx)} className="text-red-500 p-1.5 hover:bg-red-50 rounded mt-0.5 shrink-0"><IconTrash size={14} /></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><PersonalWikiApp /></ErrorBoundary>);
    </script>
</body>
</html>
