<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 🌟 타이틀과 파비콘은 리액트(React) 내부에서 동적으로 변경됩니다 -->
    <title>로딩 중...</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 구글 파이어베이스 연동 스크립트 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        .btn-primary { background-color: #0d9488; color: white; padding: 0.5rem 1rem; border-radius: 0.25rem; font-weight: 500; transition: background 0.2s; }
        .btn-primary:hover { background-color: #0f766e; }
        .btn-secondary { background-color: #e5e7eb; color: #374151; padding: 0.5rem 1rem; border-radius: 0.25rem; font-weight: 500; transition: background 0.2s; }
        .btn-secondary:hover { background-color: #d1d5db; }
        .wiki-content { font-size: 1rem; line-height: 1.6; word-break: break-word; padding-bottom: 8rem; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, errorInfo: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, errorInfo: error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-6 max-w-2xl mx-auto mt-10 bg-red-50 border-2 border-red-500 rounded-lg">
                            <h2 className="text-2xl font-bold text-red-700 mb-2">앗! 오류가 발생했습니다. 😭</h2>
                            <pre className="bg-white p-3 rounded text-sm text-gray-800 overflow-x-auto border">{this.state.errorInfo?.toString()}</pre>
                            <button className="mt-6 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-bold" onClick={() => window.location.reload()}>새로고침</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // 🔑 👇 내 파이어베이스 열쇠를 여기에 다시 덮어쓰세요! 👇
        const firebaseConfig = {
            apiKey: "AIzaSyBm1CHt21qkAunGpVaVsjfH7gqX_YdEOuc",
            authDomain: "wiki-e77fe.firebaseapp.com",
            databaseURL: "https://wiki-e77fe-default-rtdb.firebaseio.com",
            projectId: "wiki-e77fe",
            storageBucket: "wiki-e77fe.firebasestorage.app",
            messagingSenderId: "533713718953",
            appId: "1:533713718953:web:0a09fc323c5b1b527c23b8"
        };

        const isFirebaseConfigured = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("여기에");

        if (isFirebaseConfigured && !firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const IconSearch = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
        const IconEdit = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;
        const IconTrash = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconPlus = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconSave = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const IconX = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const IconHelp = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
        const IconDownload = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
        const IconUpload = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;
        const IconImage = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>;
        const IconArrowUp = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>;
        const IconArrowDown = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>;
        const IconMoreVertical = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="1.5"></circle><circle cx="12" cy="5" r="1.5"></circle><circle cx="12" cy="19" r="1.5"></circle></svg>;
        // 🌟 새로 추가된 '설정(톱니바퀴)' 아이콘
        const IconSettings = ({ size=24, className="" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;

        // 🌟 위키 전체 설정 기본값
        const DEFAULT_SETTINGS = {
            siteIcon: "📚",
            siteTitle: "나만의 위키",
            tabTitle: "개인 캐릭터 위키",
            faviconUrl: "",
            loadingMessage: "📚 클라우드 위키 불러오는 중...",
            promptEdit: "문서를 편집하려면 비밀번호를 입력하세요.",
            promptNew: "새 문서를 생성하려면 비밀번호를 입력하세요.",
            promptDelete: "정말 이 문서를 삭제하시겠습니까? 비밀번호를 입력하세요.",
            promptSettings: "위키 전체 설정을 변경하려면 비밀번호를 입력하세요."
        };

        const INITIAL_DATA = {
            "home": {
                id: "home",
                title: "대문",
                isSystem: true,
                content: "== 환영합니다! ==\n이곳은 개인 캐릭터 설정을 정리하는 위키입니다.\n\n우측 상단의 검색창이나 아래 목록을 통해 문서를 열람할 수 있습니다.\n문서를 수정하려면 우측 상단의 펜 아이콘을 클릭하고 비밀번호(0201)를 입력하세요.\n\n== 캐릭터 목록 ==\n[[char1|알렉스 머서]]\n[[char2|베아트리스]]"
            }
        };

        const DEFAULT_DOC_TEMPLATE = "== 개요 ==\n여기에 개요를 작성하세요.\n\n== 상세 ==\n상세 내용을 작성하세요.\n\n== 작중 행적 ==\n[접기:행적 보기]\n[스포일러경고]\n행적을 작성하세요.\n[/접기]";

        const getCho = (str) => {
            const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            for(let i=0; i<str.length; i++) {
                const code = str.charCodeAt(i) - 44032;
                if(code > -1 && code < 11172) return cho[Math.floor(code / 588)];
                if(/[a-zA-Z]/.test(str[i])) return 'A-Z';
                if(/[0-9]/.test(str[i])) return '0-9';
                if(str[i].trim() !== '') return '기타';
            }
            return '기타';
        };

        const choMap = {"ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ"};
        const getGroup = (str) => {
            if(!str) return '기타';
            const initial = getCho(str);
            return choMap[initial] || initial;
        };

        function PersonalWikiApp() {
            const [db, setDb] = useState(INITIAL_DATA);
            const [currentDocId, setCurrentDocId] = useState('home');
            const [isEditing, setIsEditing] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [showSearchRecs, setShowSearchRecs] = useState(false);
            const [showMoreMenu, setShowMoreMenu] = useState(false);
            const [galleryContext, setGalleryContext] = useState(null);
            const [showSettingsModal, setShowSettingsModal] = useState(false); // 🌟 위키 설정 모달 상태
            const [isLoading, setIsLoading] = useState(true);
            const searchRef = useRef(null);
            const moreMenuRef = useRef(null);
            const [editData, setEditData] = useState(null);

            // 현재 적용할 설정값 (DB에서 불러오기)
            const settings = db._wikiSettings || DEFAULT_SETTINGS;

            // 🌟 동적 타이틀 및 파비콘 변경 이펙트
            useEffect(() => {
                document.title = settings.tabTitle || DEFAULT_SETTINGS.tabTitle;
                
                if (settings.faviconUrl) {
                    let link = document.querySelector("link[rel~='icon']");
                    if (!link) {
                        link = document.createElement('link');
                        link.rel = 'icon';
                        document.head.appendChild(link);
                    }
                    link.href = settings.faviconUrl;
                }
                
                // 로딩 창을 위해 로컬 스토리지에 세팅 복사본 저장
                localStorage.setItem('cachedWikiSettings', JSON.stringify(settings));
            }, [settings]);

            useEffect(() => {
                if (!isFirebaseConfigured) {
                    const saved = localStorage.getItem('personalWikiDB');
                    if (saved) { try { setDb(JSON.parse(saved)); } catch (e) {} }
                    setIsLoading(false);
                    return;
                }

                const dbRef = firebase.database().ref('wikiDB');
                const listener = dbRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.home) {
                        setDb(data);
                    } else if (!data) {
                        setDb(INITIAL_DATA); 
                    }
                    setIsLoading(false);
                });

                return () => dbRef.off('value', listener);
            }, []);

            useEffect(() => {
                const handleHashChange = () => {
                    const hashId = window.location.hash.replace('#', '') || 'home';
                    setCurrentDocId(hashId);
                    setIsEditing(false);
                    setShowSearchRecs(false);
                    setShowMoreMenu(false);
                    window.scrollTo(0,0);
                };
                window.addEventListener('hashchange', handleHashChange);
                handleHashChange();
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (searchRef.current && !searchRef.current.contains(event.target)) setShowSearchRecs(false);
                    if (moreMenuRef.current && !moreMenuRef.current.contains(event.target)) setShowMoreMenu(false);
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const navigateTo = (id) => {
                if (db[id] || id === 'home' || id.startsWith('category:')) window.location.hash = id; 
                else alert("존재하지 않는 문서입니다.");
            };

            const handleSaveData = (newDb) => {
                setDb(newDb);
                if (!isFirebaseConfigured) {
                    localStorage.setItem('personalWikiDB', JSON.stringify(newDb));
                } else {
                    firebase.database().ref('wikiDB').set(newDb)
                        .catch(() => alert("구글 서버 저장 중 오류가 발생했습니다."));
                }
            };

            const currentDoc = db[currentDocId] || db['home'] || INITIAL_DATA['home'];
            const isCategoryView = currentDocId.startsWith('category:');
            const currentCategoryName = isCategoryView ? decodeURIComponent(currentDocId.replace('category:', '')) : '';

            // 🌟 모든 비밀번호 프롬프트에 커스텀 메시지 적용
            const startEditing = () => {
                const pass = prompt(settings.promptEdit || DEFAULT_SETTINGS.promptEdit);
                if (pass !== '0201') { if(pass !== null) alert("비밀번호가 틀렸습니다."); return; }
                
                let profileImgs = currentDoc.profileImages || [];
                if (profileImgs.length === 0 && currentDoc.image) {
                    profileImgs = [{ url: currentDoc.image, caption: "" }];
                }

                setEditData({ 
                    ...currentDoc, 
                    attributes: currentDoc.attributes ? [...currentDoc.attributes] : [],
                    profileImages: profileImgs,
                    tables: currentDoc.tables ? [...currentDoc.tables] : [],
                    hideProfile: currentDoc.hideProfile || false
                });
                setIsEditing(true);
            };

            const createNewDoc = () => {
                const pass = prompt(settings.promptNew || DEFAULT_SETTINGS.promptNew);
                if (pass !== '0201') { if(pass !== null) alert("비밀번호가 틀렸습니다."); return; }
                
                const newId = `doc_${Date.now()}`;
                const newDoc = {
                    id: newId, title: "새 문서", subtitle: "", categories: "", profileColor: "#475569", spoilerColor: "#0f766e", quoteColor: "#374151", engName: "New Character", 
                    profileImages: [], tables: [],
                    attributes: [{ label: "정보", value: "내용" }], content: DEFAULT_DOC_TEMPLATE,
                    lastModified: new Date().toISOString(),
                    hideProfile: false
                };
                const newDb = { ...db, [newId]: newDoc };
                handleSaveData(newDb);
                window.location.hash = newId; 
                setEditData(newDoc);
                setIsEditing(true);
            };

            const deleteDoc = (docId) => {
                if (db[docId] && db[docId].isSystem) { alert("대문은 삭제할 수 없습니다."); return; }
                const pass = prompt(settings.promptDelete || DEFAULT_SETTINGS.promptDelete);
                if (pass === '0201') {
                    const newDb = { ...db };
                    delete newDb[docId];
                    handleSaveData(newDb);
                    window.location.hash = 'home';
                } else if(pass !== null) {
                    alert("비밀번호가 틀렸습니다.");
                }
            };

            const openSettingsCheck = () => {
                setShowMoreMenu(false);
                const pass = prompt(settings.promptSettings || DEFAULT_SETTINGS.promptSettings);
                if (pass === '0201') {
                    setShowSettingsModal(true);
                } else if(pass !== null) {
                    alert("비밀번호가 틀렸습니다.");
                }
            };

            const exportData = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
                const dlAnchorElem = document.createElement('a');
                dlAnchorElem.setAttribute("href", dataStr);
                dlAnchorElem.setAttribute("download", "wiki_backup.json");
                dlAnchorElem.click();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (imported && imported.home) {
                            handleSaveData(imported);
                            window.location.hash = 'home';
                            alert("데이터가 완벽하게 복구(업로드) 되었습니다!");
                        } else alert("올바르지 않은 데이터 형식입니다.");
                    } catch (err) { alert("파일을 읽는 중 오류가 발생했습니다."); }
                };
                reader.readAsText(file);
            };

            if (isLoading) {
                // 🌟 로딩 중에는 로컬에 저장된 세팅값을 우선으로 보여줌
                const cached = localStorage.getItem('cachedWikiSettings');
                const initialSettings = cached ? JSON.parse(cached) : DEFAULT_SETTINGS;
                const loadingMsg = initialSettings.loadingMessage || DEFAULT_SETTINGS.loadingMessage;
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-xl font-bold text-teal-700 animate-pulse">{loadingMsg}</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 text-gray-800 font-sans pb-10">
                    <header className="bg-teal-700 text-white shadow-md sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
                            {/* 🌟 동적으로 변경되는 상단바 아이콘 및 타이틀 */}
                            <div className="text-xl font-bold cursor-pointer flex items-center gap-2" onClick={() => navigateTo('home')}>
                                <span className="text-2xl">{settings.siteIcon}</span>
                                <span>{settings.siteTitle}</span>
                            </div>
                            
                            <div className="flex items-center gap-2 sm:gap-4">
                                <div className="relative" ref={searchRef}>
                                    <div className="flex items-center bg-white rounded text-gray-800 px-2 py-1 focus-within:ring-2 ring-teal-400">
                                        <IconSearch size={16} className="text-gray-400" />
                                        <input 
                                            type="text" placeholder="문서 검색..." 
                                            className="bg-transparent outline-none ml-2 w-24 sm:w-48 text-sm"
                                            value={searchQuery}
                                            onChange={(e) => { setSearchQuery(e.target.value); setShowSearchRecs(true); }}
                                            onFocus={() => setShowSearchRecs(true)}
                                        />
                                    </div>
                                    {showSearchRecs && searchQuery && (
                                        <div className="absolute top-full right-0 mt-1 w-48 sm:w-full bg-white text-gray-800 shadow-lg rounded border border-gray-200 max-h-60 overflow-y-auto z-50">
                                            {Object.values(db)
                                                .filter(doc => doc.title && doc.id !== '_gallery' && doc.id !== '_wikiSettings')
                                                .filter(doc => {
                                                    const fullTitle = doc.subtitle ? `${doc.title} (${doc.subtitle})` : (doc.title || "");
                                                    return fullTitle.toLowerCase().includes(searchQuery.toLowerCase());
                                                })
                                                .map(doc => (

                                <div className="flex gap-1 relative" ref={moreMenuRef}>

                                    <button onClick={() => setShowMoreMenu(!showMoreMenu)} title="더보기" className="p-1 sm:p-1.5 hover:bg-teal-600 rounded"><IconMoreVertical size={18} /></button>
                                    
                                    {showMoreMenu && (
                                        <div className="absolute top-full right-0 mt-2 w-48 bg-white text-gray-800 shadow-xl border border-gray-200 rounded overflow-hidden z-[100]">

                                            <button onClick={openSettingsCheck} className="w-full text-left px-4 py-3 hover:bg-teal-50 border-b border-gray-100 flex items-center gap-2 text-sm font-medium"><IconSettings size={16} className="text-teal-600"/> 위키 전체 설정</button>

                                            <label className="w-full text-left px-4 py-3 hover:bg-teal-50 flex items-center gap-2 cursor-pointer text-sm font-medium">
                                                <IconUpload size={16} className="text-teal-600"/> 백업 파일 복구
                                                <input type="file" accept=".json" className="hidden" onChange={(e) => { setShowMoreMenu(false); importData(e); }} />
                                            </label>

                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-4 md:p-6 lg:p-8 bg-white min-h-[calc(100vh-3.5rem)] shadow-sm">
                        {isEditing ? (
                            <EditorView 
                                editData={editData} setEditData={setEditData} 
                                onSave={(newData) => {
                                    const finalData = { ...newData, lastModified: new Date().toISOString() };
                                    const newDb = { ...db, [finalData.id]: finalData };
                                    handleSaveData(newDb);
                                    setIsEditing(false);
                                }}
                                onCancel={() => {
                                    setIsEditing(false);
                                    if (currentDocId === editData.id && !db[currentDocId]) window.location.hash = 'home';
                                }}
                                onDelete={() => deleteDoc(editData.id)}
                                openGallery={setGalleryContext}
                                gallery={db._gallery || {}}
                            />
                        ) : isCategoryView ? (
                            <CategoryView categoryName={currentCategoryName} db={db} navigateTo={navigateTo} />
                        ) : (
                            <DocumentView doc={currentDoc} navigateTo={navigateTo} gallery={db._gallery || {}} />
                        )}
                    </main>

                    {galleryContext && (
                        <GalleryModal 
                            db={db} handleSaveData={handleSaveData} context={galleryContext} 
                            onClose={() => setGalleryContext(null)} 
                        />
                    )}

                    {/* 🌟 위키 설정 모달창 */}
                    {showSettingsModal && (
                        <SettingsModal 
                            db={db} 
                            handleSaveData={handleSaveData} 
                            onClose={() => setShowSettingsModal(false)} 
                            openGallery={setGalleryContext}

                    )}
                </div>
            );
        }

        // 🌟 위키 전체 설정 모달 컴포넌트 추가
        function SettingsModal({ db, handleSaveData, onClose, openGallery }) {
            const [formData, setFormData] = useState(db._wikiSettings || DEFAULT_SETTINGS);

            const handleChange = (field, value) => {

            const handleSave = () => {

                onClose();

            return (
                <div className="fixed inset-0 bg-black/70 z-[250] flex items-center justify-center p-2 sm:p-4">
                    <div className="bg-white rounded-lg w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl">
                        <div className="flex justify-between items-center p-4 border-b">
                            <h2 className="text-xl font-bold flex items-center gap-2"><IconSettings size={24} className="text-teal-600"/> 위키 전체 설정</h2>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800 bg-gray-100 rounded-full p-1"><IconX size={20}/></button>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
                            
                            <div className="border border-gray-200 p-4 rounded bg-gray-50">

                                        </div>
                                        <div className="flex-1">
                                            <label className="block text-xs font-bold text-gray-700 mb-1">상단바 위키 제목</label>
                                            <input type="text" value={formData.siteTitle} onChange={e => handleChange('siteTitle', e.target.value)} className="w-full p-2 border rounded outline-none" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">브라우저 탭 이름 (웹문서 타이틀)</label>
                                        <input type="text" value={formData.tabTitle} onChange={e => handleChange('tabTitle', e.target.value)} className="w-full p-2 border rounded outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">브라우저 탭 아이콘 (파비콘 URL)</label>
                                        <div className="flex gap-2 items-center">
                                            <input type="text" value={formData.faviconUrl} onChange={e => handleChange('faviconUrl', e.target.value)} placeholder="이미지 주소 또는 보관함에서 선택" className="flex-1 p-2 border rounded outline-none text-xs sm:text-sm" />
                                            <button 
                                                onClick={() => openGallery({ action: (id) => handleChange('faviconUrl', db._gallery[id] || '') })}
                                                className="shrink-0 bg-teal-100 hover:bg-teal-200 text-teal-800 text-xs px-2 py-2 rounded font-bold border border-teal-200"
                                            >보관함에서 찾기</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">로딩 화면 문구</label>
                                        <input type="text" value={formData.loadingMessage} onChange={e => handleChange('loadingMessage', e.target.value)} className="w-full p-2 border rounded outline-none" />
                                    </div>
                                </div>
                            </div>

                            <div className="border border-gray-200 p-4 rounded bg-gray-50">
                                <h3 className="font-bold text-gray-800 mb-3 border-b pb-2">2. 안내 문구 (비밀번호 확인창) 커스텀</h3>
                                <div className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">기존 문서 '편집' 시 문구</label>
                                        <input type="text" value={formData.promptEdit} onChange={e => handleChange('promptEdit', e.target.value)} className="w-full p-2 border rounded outline-none text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">'새 문서 생성' 시 문구</label>
                                        <input type="text" value={formData.promptNew} onChange={e => handleChange('promptNew', e.target.value)} className="w-full p-2 border rounded outline-none text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">문서 '삭제' 시 문구</label>
                                        <input type="text" value={formData.promptDelete} onChange={e => handleChange('promptDelete', e.target.value)} className="w-full p-2 border rounded outline-none text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">'위키 설정' 진입 시 문구</label>
                                        <input type="text" value={formData.promptSettings} onChange={e => handleChange('promptSettings', e.target.value)} className="w-full p-2 border rounded outline-none text-sm" />

                        </div>
                        <div className="p-4 border-t flex justify-end gap-2 bg-gray-100 rounded-b-lg">
                            <button onClick={onClose} className="btn-secondary">취소</button>
                            <button onClick={handleSave} className="btn-primary">변경사항 저장</button>
